<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>“More detail” drawer: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
.drawer{position:absolute;inset-block:0;inset-inline-end:0;width:58%;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:-.4em 0 1em rgba(27,30,36,.12);padding:.8em 1em;transform:translateX(105%);visibility:hidden;transition:transform .22s var(--ease-out),visibility 0s .22s;font-size:.9em;display:flex;flex-direction:column;gap:.4em}
.drawer.open{transform:none;visibility:visible;transition:transform .22s var(--ease-out)}
[dir=rtl] .drawer{transform:translateX(-105%)}[dir=rtl] .drawer.open{transform:none}
.drawer ul{margin:0;padding-inline-start:1.1em}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">“More detail” drawer</h1>
<div class="stage" role="group" aria-label="Demo: “More detail” drawer">
<div class="deck"><div class="deck-bar"><span class="muted mono" id="pos"></span><span style="flex:1"></span><button class="sbtn" id="md" aria-expanded="false" aria-controls="dr">More detail</button></div>
<div class="deck-body"><p class="kicker" id="k"></p><p class="h" id="t"></p><p class="p" id="p"></p>
<aside class="drawer" id="dr" aria-label="Backup notes"><div class="row"><strong style="flex:1">Backup notes</strong><button class="sbtn" id="x" aria-label="Close notes">✕</button></div><ul id="notes"></ul></aside></div>
<div class="deck-foot"><button class="sbtn" id="pv">← Prev</button><button class="sbtn" id="nx">Next →</button></div></div>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>Each slide carries its own backup notes. The More detail button slides a drawer in from the side with the notes for the current slide only; closing it returns focus to the button. Switch slides to see the drawer content change.</p></details>
</main>
<script src="_harness.js"></script>
<script>
var S=[{k:'Problem',t:'Releases take 9 days',p:'Most of the wait is sign-off.',n:['Median of the last 40 releases','Excludes hotfixes','Sign-off share estimated from tickets']},
{k:'Options',t:'Automating checks saves the most',p:'Delegation helps less.',n:['Automation removes two hand-offs','Delegation needs new roles','Batching delays urgent fixes']},
{k:'Plan',t:'Pilot with one team',p:'Decide after six weeks.',n:['Pilot team volunteered','Success = under 5 days','Rollback plan agreed']}];
var i=0,api;
function draw(){var s=S[i];k.textContent=s.k;t.textContent=s.t;p.textContent=s.p;pos.textContent=(i+1)+' / 3';notes.innerHTML=s.n.map(function(x){return '<li>'+x+'</li>';}).join('');pv.disabled=i===0;nx.disabled=i===2;}
function setOpen(o){dr.classList.toggle('open',o);md.setAttribute('aria-expanded',String(o));if(o){x.focus();api.status('Notes for slide '+(i+1));}else md.focus();}
md.addEventListener('click',function(){setOpen(!dr.classList.contains('open'));});
x.addEventListener('click',function(){setOpen(false);});
dr.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();setOpen(false);}});
pv.addEventListener('click',function(){i--;draw();});nx.addEventListener('click',function(){i++;draw();});
api=AtlasDemo.init({frames:0,interactive:true,reset:function(){i=0;dr.classList.remove('open');md.setAttribute('aria-expanded','false');draw();}});
</script>
</body>
</html>
