<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histogram / box plot / violin: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.ch{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ch text{font-family:var(--f-body);font-size:13px;fill:var(--ink-2)}
.ch .ax{font:13px var(--f-mono);fill:var(--muted)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .base{stroke:var(--muted);stroke-width:1}
.ch .ttl{font:700 17px var(--f-display);fill:var(--fg)}
.ch .sub{font-size:13px;fill:var(--muted)}
.ch .lbl{font-weight:600;fill:var(--fg)}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s var(--ease-out),opacity .4s var(--ease-out)}
.grow.top{transform-origin:50% 0}
.growx{transform-box:fill-box;transform-origin:0 50%;transition:transform .6s var(--ease-out),opacity .4s var(--ease-out)}
.growx.end{transform-origin:100% 50%}
.off.grow{transform:scaleY(0)}.off.growx{transform:scaleX(0)}
.draw{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1s var(--ease-out)}.draw.off{stroke-dashoffset:1}
.fade{transition:opacity .45s var(--ease-out)}.fade.off{opacity:0}
@keyframes enter{from{opacity:0}to{opacity:1}}.enter{animation:enter .6s var(--ease-out) both}
.ch [tabindex]{outline:none;cursor:pointer}
.ch [tabindex]:focus-visible{stroke:var(--fg);stroke-width:2.5px}
.ch .tip rect{fill:var(--fg)}.ch .tip text{fill:#fff;font:500 13px var(--f-mono)}
.sctl{position:absolute;inset-block-start:2.2em;inset-inline-end:.6em;display:flex;gap:.3em;align-items:center;z-index:4}
.sctl label{font-size:.8em;color:var(--muted)}
.sctl input[type=range]{width:7em;accent-color:var(--accent)}
.sctl output{font:600 .85em var(--f-mono);min-width:2.8em}

</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Histogram / box plot / violin</h1>
<div class="stage" role="img" aria-label="Demo: Histogram / box plot / violin. Eighty release times shown as a histogram of counts per day, then a box plot with median, quartiles, whiskers and outliers, then a violin outline of the smoothed distribution.">
<span class="label-illustrative">Illustrative</span>
<svg class="ch" id="ch" viewBox="0 0 480 300" aria-hidden="true"></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>The same 80 release times appear three ways: a histogram of counts per day, a box plot (median, middle half, whiskers to 1.5× the box, outliers as dots), then a violin outline showing the smoothed shape. Data is illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
var NS='http://www.w3.org/2000/svg';
function S(t,a,p,x){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;if(p)p.appendChild(n);return n;}
function lin(d0,d1,r0,r1){return function(v){return r0+(v-d0)/(d1-d0)*(r1-r0);};}
function on(n,b){n.classList.toggle('off',!b);}
function yAxis(g,s,ticks,x0,x1,fmt){ticks.forEach(function(t){var y=s(t);S('line',{x1:x0,x2:x1,y1:y,y2:y,'class':'grid'},g);S('text',{x:x0-6,y:y+4.5,'text-anchor':'end','class':'ax'},g,fmt?fmt(t):String(t));});}
function title(g,t,sub){S('text',{x:16,y:27,'class':'ttl'},g,t);if(sub)S('text',{x:16,y:45,'class':'sub'},g,sub);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function Tip(svg){var g=S('g',{'class':'tip','pointer-events':'none',opacity:0},svg),r=S('rect',{rx:5,height:24},g),t=S('text',{},g);
 return {show:function(x,y,s){svg.appendChild(g);t.textContent=s;var w=(t.getComputedTextLength?t.getComputedTextLength():s.length*7.8)+16;var X=Math.max(4,Math.min(476-w,x-w/2)),Y=y-34<4?y+12:y-34;r.setAttribute('x',X);r.setAttribute('y',Y);r.setAttribute('width',w);t.setAttribute('x',X+8);t.setAttribute('y',Y+16.5);g.setAttribute('opacity',1);},hide:function(){g.setAttribute('opacity',0);}};}
(function () {
    var svg = document.getElementById('ch'), R = rng(42), V = [];
    for (var i = 0; i < 80; i++) { var u = 1 - R(), w = R(); var z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * w); V.push(Math.min(19.5, Math.max(1, Math.exp(1.6 + 0.45 * z)))); }
    V.sort(function (a, b) { return a - b; });
    var q = function (p) { var k = (V.length - 1) * p, lo = Math.floor(k); return V[lo] + (V[Math.min(lo + 1, V.length - 1)] - V[lo]) * (k - lo); };
    var q1 = q(.25), md = q(.5), q3 = q(.75), iqr = q3 - q1;
    var wl = V.filter(function (v) { return v >= q1 - 1.5 * iqr; })[0], wh = V.filter(function (v) { return v <= q3 + 1.5 * iqr; }).pop();
    title(svg, 'Middle half of releases: ' + q1.toFixed(1) + '–' + q3.toFixed(1) + ' days', 'Release cycle time, 80 releases, days');
    var x = lin(0, 20, 56, 456), bins = []; for (var b = 0; b < 20; b++) bins.push(0);
    V.forEach(function (v) { bins[Math.min(19, Math.floor(v))]++; });
    var top = Math.ceil(Math.max.apply(null, bins) / 5) * 5, y = lin(0, top, 178, 64);
    var tks = []; for (var t = 0; t <= top; t += 5) tks.push(t);
    yAxis(svg, y, tks, 50, 460);
    [0, 5, 10, 15, 20].forEach(function (t) { S('text', { x: x(t), y: 284, 'text-anchor': 'middle', 'class': 'ax' }, svg, t); });
    S('line', { x1: 50, x2: 460, y1: 266, y2: 266, 'class': 'base' }, svg);
    var hb = bins.map(function (c, k) { var r = S('rect', { x: x(k) + 1, y: y(c), width: x(1) - x(0) - 2, height: y(0) - y(c), fill: 'var(--accent)', 'class': 'grow off' }, svg); r.style.transitionDelay = (k * 30) + 'ms'; return r; });
    var CY = 224;
    var vio = S('path', { fill: 'var(--accent-soft)', stroke: 'var(--accent)', 'stroke-width': 1.5, 'class': 'fade off' }, svg);
    var pts = [], bw = 1.1, maxd = 0;
    for (var gx = 0.5; gx <= 20; gx += 0.25) { var d = 0; V.forEach(function (v) { var e = (gx - v) / bw; d += Math.exp(-0.5 * e * e); }); pts.push([gx, d]); maxd = Math.max(maxd, d); }
    vio.setAttribute('d', 'M' + pts.map(function (p) { return x(p[0]) + ',' + (CY - p[1] / maxd * 30); }).join('L') + 'L' + pts.slice().reverse().map(function (p) { return x(p[0]) + ',' + (CY + p[1] / maxd * 30); }).join('L') + 'Z');
    var box = S('g', { 'class': 'fade off' }, svg);
    S('line', { x1: x(wl), x2: x(wh), y1: CY, y2: CY, stroke: 'var(--fg)', 'stroke-width': 1.5 }, box);
    [wl, wh].forEach(function (v) { S('line', { x1: x(v), x2: x(v), y1: CY - 8, y2: CY + 8, stroke: 'var(--fg)', 'stroke-width': 1.5 }, box); });
    S('rect', { x: x(q1), y: CY - 13, width: x(q3) - x(q1), height: 26, fill: '#fff', stroke: 'var(--fg)', 'stroke-width': 1.5 }, box);
    S('line', { x1: x(md), x2: x(md), y1: CY - 13, y2: CY + 13, stroke: 'var(--accent)', 'stroke-width': 3 }, box);
    V.filter(function (v) { return v < wl || v > wh; }).forEach(function (v) { S('circle', { cx: x(v), cy: CY, r: 3.5, fill: 'none', stroke: 'var(--fg)', 'stroke-width': 1.5 }, box); });
    S('text', { x: x(md), y: CY - 36, 'text-anchor': 'middle', 'class': 'ax' }, box, 'median ' + md.toFixed(1));
    AtlasDemo.init({ frames: 3, stepMs: 1400, render: function (f) {
      hb.forEach(function (r) { on(r, f >= 1); }); on(box, f >= 2); on(vio, f >= 3);
    } });
  })();
</script>
</body>
</html>
