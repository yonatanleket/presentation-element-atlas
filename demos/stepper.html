<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
.wrap{position:absolute;inset:.9em;display:grid;grid-template-rows:auto 1fr auto;gap:.5em}
.sp{display:flex;align-items:center;gap:.3em}
.sp .n{width:1.7em;height:1.7em;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 .8em var(--f-mono);color:var(--muted);background:var(--surface);transition:all .25s}
.sp .n.done{background:var(--accent);border-color:var(--accent);color:#fff}.sp .n.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 .2em var(--accent-soft)}
.sp .ln{flex:1;height:2px;background:var(--line)}.sp .ln.done{background:var(--accent)}
svg{width:100%;height:100%}
.ly{opacity:0;transition:opacity .4s var(--ease-out)}.ly.on{opacity:1}
.tx{font:600 14px var(--f-body);fill:var(--fg)}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Stepper</h1>
<div class="stage" role="img" aria-label="Demo: Stepper. A four-step stepper; each step adds one layer to a delivery diagram and updates the caption.">
<div class="wrap">
  <div class="sp" id="sp" aria-hidden="true"><span class="n">1</span><span class="ln"></span><span class="n">2</span><span class="ln"></span><span class="n">3</span><span class="ln"></span><span class="n">4</span></div>
  <svg viewBox="0 0 440 150" aria-hidden="true">
    <g class="ly"><circle cx="50" cy="75" r="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text class="tx" x="50" y="125" text-anchor="middle">Customer</text></g>
    <g class="ly"><path d="M80 75h55" stroke="var(--muted)" stroke-width="2"/><rect x="140" y="52" width="60" height="46" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="2"/><text class="tx" x="170" y="125" text-anchor="middle">Order</text></g>
    <g class="ly"><path d="M205 75h50" stroke="var(--muted)" stroke-width="2"/><path d="M260 98V62l35-18 35 18v36z" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2"/><text class="tx" x="295" y="125" text-anchor="middle">Warehouse</text></g>
    <g class="ly"><path d="M335 75h35" stroke="var(--muted)" stroke-width="2"/><rect x="372" y="58" width="50" height="30" rx="5" fill="var(--accent)"/><circle cx="384" cy="92" r="6" fill="var(--fg)"/><circle cx="410" cy="92" r="6" fill="var(--fg)"/><text class="tx" x="397" y="125" text-anchor="middle">Courier</text></g>
  </svg>
  <p class="p" id="cap"></p>
</div>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>A numbered stepper sits above the diagram. Each step marks the next number as current and adds one more layer to the picture (customer, order, warehouse, courier) with a one-line caption, so the story is told in layers at a pace the viewer sets.</p></details>
</main>
<script src="_harness.js"></script>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i);};
var isRtl=function(){return (document.dir||document.documentElement.dir)==='rtl';};
var C=['Four steps from click to doorstep.','1 · A customer taps Buy.','2 · An order is created and paid.','3 · The nearest warehouse picks and packs it.','4 · A courier delivers it the next day.'];
var ns=$('sp').querySelectorAll('.n'),ls=$('sp').querySelectorAll('.ln'),ly=document.querySelectorAll('.ly');
AtlasDemo.init({frames:4,stepMs:1200,render:function(f){ns.forEach(function(n,i){n.classList.toggle('done',i<f-1||(f===4&&i===3));n.classList.toggle('cur',i===f-1&&f<4);});
  ls.forEach(function(l,i){l.classList.toggle('done',i<f-1);});ly.forEach(function(g,i){g.classList.toggle('on',i<f);});$('cap').textContent=C[f];}});
})();
</script>
</body>
</html>
