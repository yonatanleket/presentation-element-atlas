<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric card grid with limitations: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
.filt{display:flex;gap:.3em;flex-wrap:wrap}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:.45em;flex:1;min-height:0}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:.45em;padding:.4em .55em;display:flex;flex-direction:column;gap:.15em;font-size:.82em;min-height:0}
.mc[hidden]{display:none}
.mc .top{display:flex;justify-content:space-between;align-items:center;gap:.3em}
.mc .v{font:700 1.6em/1 var(--f-display);font-variant-numeric:tabular-nums}
.mc .lim{color:var(--adv)}
.mc button{align-self:flex-start;font:500 .95em var(--f-body);background:none;border:0;padding:.1em 0;color:var(--accent);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Metric card grid with limitations</h1>
<div class="stage" role="group" aria-label="Demo: Metric card grid with limitations">
<span class="label-illustrative" style="inset-block-start:auto;inset-block-end:.4em">Illustrative</span>
<div class="fill pad col" style="padding:.7em .8em;gap:.45em"><div class="filt" id="filt" role="group" aria-label="Metric type"></div><div class="mg" id="mg"></div></div>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>Each card pairs a metric with its definition, value, main limitation and a provenance tag such as Measured or Estimated. Filter by metric type, or open a card to read its limitation. All values are illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
var M=[{type:'Adoption',name:'Weekly active teams',v:'64%',def:'Teams with one or more releases a week.',lim:'Counts any release, even trivial ones.',tag:['Measured','ok']},
{type:'Speed',name:'Median release time',v:'5.2 d',def:'Merge to production, median.',lim:'Hides long-tail releases.',tag:['Measured','ok']},
{type:'Quality',name:'Rollback rate',v:'3.1%',def:'Releases reverted within 48 h.',lim:'Misses silent failures.',tag:['Estimated','warn']},
{type:'Speed',name:'Time saved per release',v:'1.4 d',def:'Expected drop after automation.',lim:'Based on a two-team pilot.',tag:['Target','adv']}];
var cur='All',api;
filt.innerHTML=['All','Adoption','Speed','Quality'].map(function(x){return '<button class="sbtn" data-f="'+x+'" aria-pressed="'+(x==='All')+'">'+x+'</button>';}).join('');
mg.innerHTML=M.map(function(m,i){return '<article class="mc" data-type="'+m.type+'"><div class="top"><span class="mono muted">'+m.type+'</span><span class="pill '+m.tag[1]+'">'+m.tag[0]+'</span></div><strong>'+m.name+'</strong><span class="v">'+m.v+'</span><span class="d" id="d'+i+'">'+m.def+'</span><button aria-expanded="false" data-i="'+i+'">Limitation</button></article>';}).join('');
function setF(f){cur=f;filt.querySelectorAll('[data-f]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.f===f));});mg.querySelectorAll('.mc').forEach(function(c){c.hidden=f!=='All'&&c.dataset.type!==f;});}
filt.addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;setF(b.dataset.f);api.status('Showing: '+b.dataset.f);});
mg.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;var i=+b.dataset.i,d=document.getElementById('d'+i),open=b.getAttribute('aria-expanded')==='true';
  b.setAttribute('aria-expanded',String(!open));b.textContent=open?'Limitation':'Definition';d.textContent=open?M[i].def:'Limitation: '+M[i].lim;d.classList.toggle('lim',!open);});
api=AtlasDemo.init({frames:0,interactive:true,idleText:'Filter by type or open a limitation',reset:function(){setF('All');mg.querySelectorAll('[data-i]').forEach(function(b){var i=+b.dataset.i,d=document.getElementById('d'+i);b.setAttribute('aria-expanded','false');b.textContent='Limitation';d.textContent=M[i].def;d.classList.remove('lim');});}});
</script>
</body>
</html>
