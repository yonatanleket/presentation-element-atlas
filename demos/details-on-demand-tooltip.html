<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details-on-demand tooltip: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg{position:absolute;inset:.9em;width:calc(100% - 1.8em);height:calc(100% - 1.8em)}
.ax{font:13px var(--f-mono);fill:var(--muted)}
.pt{fill:var(--surface);stroke:var(--accent);stroke-width:2;transition:r .2s}
.pt.on{r:7;fill:var(--accent)}
.tip{position:absolute;background:var(--fg);color:#fff;border-radius:.35em;padding:.3em .55em;font:.8em/1.3 var(--f-mono);transform:translate(-50%,-125%);opacity:0;transition:opacity .2s var(--ease-out),left .5s var(--ease-out),top .5s var(--ease-out);white-space:nowrap}
.tip.on{opacity:1}
.ptr{position:absolute;width:1.1em;height:1.1em;transition:left .5s var(--ease-out),top .5s var(--ease-out),opacity .2s;opacity:0}
.ptr.on{opacity:1}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Details-on-demand tooltip</h1>
<div class="stage" role="img" aria-label="Demo: Details-on-demand tooltip. A line chart without value labels; a simulated pointer visits three points and a tooltip shows each exact value.">
<span class="label-illustrative">Illustrative</span>
<svg viewBox="0 0 450 270" aria-hidden="true" id="svg"><text class="ax" x="8" y="20">Weekly sign-ups</text><line x1="30" y1="240" x2="440" y2="240" stroke="var(--line)"/><polyline id="ln" fill="none" stroke="var(--accent)" stroke-width="2.5"/><g id="pts"></g><g id="xl"></g></svg>
<div class="tip" id="tip"></div>
<svg class="ptr" id="ptr" viewBox="0 0 16 16" aria-hidden="true" style="inset:auto;width:1.1em;height:1.1em"><path d="M2 1l11 7-5 1 3 6-2 1-3-6-4 3z" fill="#1b1e24" stroke="#fff" stroke-width="1"/></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>The chart stays clean, with no value labels on the line. A simulated pointer visits three points in turn; each time, the point enlarges and a tooltip shows the exact value and month, which is how detail is offered only to whoever asks for it.</p></details>
</main>
<script src="_harness.js"></script>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i);};
var isRtl=function(){return (document.dir||document.documentElement.dir)==='rtl';};
var V=[320,410,380,520,610,560,700,760],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'],P=[];
V.forEach(function(v,i){P.push([50+i*55,240-v/800*200]);});
$('ln').setAttribute('points',P.map(function(p){return p.join(',');}).join(' '));
$('pts').innerHTML=P.map(function(p){return '<circle class="pt" r="4" cx="'+p[0]+'" cy="'+p[1]+'"/>';}).join('');
$('xl').innerHTML=P.map(function(p,i){return '<text class="ax" text-anchor="middle" x="'+p[0]+'" y="260">'+M[i]+'</text>';}).join('');
var pts=$('pts').children,VIS=[null,2,4,7];
function pos(i){var s=$('svg').getBoundingClientRect(),st=document.querySelector('.stage').getBoundingClientRect(),k=s.width/450;return [s.left-st.left+P[i][0]*k,s.top-st.top+P[i][1]*k];}
AtlasDemo.init({frames:3,stepMs:1400,render:function(f){var i=VIS[f];for(var k=0;k<pts.length;k++)pts[k].classList.toggle('on',k===i);
  var tip=$('tip'),ptr=$('ptr');tip.classList.toggle('on',i!=null);ptr.classList.toggle('on',i!=null);if(i==null)return;
  var p=pos(i);tip.style.left=p[0]+'px';tip.style.transform=i>=6?'translate(-88%,-125%)':'';tip.style.top=p[1]+'px';tip.textContent=M[i]+' · '+V[i]+' sign-ups';ptr.style.left=(p[0]+4)+'px';ptr.style.top=(p[1]+4)+'px';}});
})();
</script>
</body>
</html>
