<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress ring / gauge: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
.ring{width:44%;max-width:12em;position:relative}
.ring svg{display:block;width:100%;transform:rotate(-90deg)}
[dir=rtl] .ring svg{transform:rotate(-90deg) scaleY(-1)}
.arc{transition:stroke-dashoffset 1.1s var(--ease-out)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:700 2.4em/1 var(--f-display);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Progress ring / gauge</h1>
<div class="stage" role="img" aria-label="Demo: Progress ring / gauge">
<span class="label-illustrative">Illustrative</span>
<div class="fill center"><div class="ring" role="img" aria-label="Rollout 72% complete"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="12"/><circle class="arc" id="arc" cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg>
<div class="c"><b id="v">0%</b><span class="muted" style="font-size:.85em">rollout complete</span></div></div></div>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>A circular track fills clockwise toward the goal while the percentage in the middle counts up. Reduced motion shows the final fill. The completion rate is illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
AtlasDemo.init({frames:1,stepMs:400,render:function(f,ctx){arc.style.strokeDashoffset=f?314.16*(1-.72):314.16;AtlasDemo.countUp(v,f?72:0,{animate:ctx.animate,suffix:'%',duration:1100});}});
</script>
</body>
</html>
