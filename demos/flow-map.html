<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow map: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.ch{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ch text{font-family:var(--f-body);font-size:13px;fill:var(--ink-2)}
.ch .ax{font:13px var(--f-mono);fill:var(--muted)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .base{stroke:var(--muted);stroke-width:1}
.ch .ttl{font:700 17px var(--f-display);fill:var(--fg)}
.ch .sub{font-size:13px;fill:var(--muted)}
.ch .lbl{font-weight:600;fill:var(--fg)}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s var(--ease-out),opacity .4s var(--ease-out)}
.grow.top{transform-origin:50% 0}
.growx{transform-box:fill-box;transform-origin:0 50%;transition:transform .6s var(--ease-out),opacity .4s var(--ease-out)}
.growx.end{transform-origin:100% 50%}
.off.grow{transform:scaleY(0)}.off.growx{transform:scaleX(0)}
.draw{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1s var(--ease-out)}.draw.off{stroke-dashoffset:1}
.fade{transition:opacity .45s var(--ease-out)}.fade.off{opacity:0}
@keyframes enter{from{opacity:0}to{opacity:1}}.enter{animation:enter .6s var(--ease-out) both}
.ch [tabindex]{outline:none;cursor:pointer}
.ch [tabindex]:focus-visible{stroke:var(--fg);stroke-width:2.5px}
.ch .tip rect{fill:var(--fg)}.ch .tip text{fill:#fff;font:500 13px var(--f-mono)}
.sctl{position:absolute;inset-block-start:2.2em;inset-inline-end:.6em;display:flex;gap:.3em;align-items:center;z-index:4}
.sctl label{font-size:.8em;color:var(--muted)}
.sctl input[type=range]{width:7em;accent-color:var(--accent)}
.sctl output{font:600 .85em var(--f-mono);min-width:2.8em}

</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Flow map</h1>
<div class="stage" role="group" aria-label="Demo: Flow map. A fictional map of five towns with curved lines from a chosen origin whose thickness shows weekly shipments; buttons switch the origin.">
<span class="label-illustrative">Illustrative</span>
<svg class="ch" id="ch" viewBox="0 0 480 300"></svg><div class="sctl" role="group" aria-label="Origin"><button class="sbtn" type="button" data-o="0" aria-pressed="true">From Avel</button><button class="sbtn" type="button" data-o="3" aria-pressed="false">From Dunholm</button></div>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>Lines run from the chosen origin to each destination, and line thickness is proportional to weekly shipments (see the key). Switch the origin to redraw the flows; hover or Tab to a line for its exact volume. Places and volumes are illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
var NS='http://www.w3.org/2000/svg';
function S(t,a,p,x){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;if(p)p.appendChild(n);return n;}
function lin(d0,d1,r0,r1){return function(v){return r0+(v-d0)/(d1-d0)*(r1-r0);};}
function on(n,b){n.classList.toggle('off',!b);}
function yAxis(g,s,ticks,x0,x1,fmt){ticks.forEach(function(t){var y=s(t);S('line',{x1:x0,x2:x1,y1:y,y2:y,'class':'grid'},g);S('text',{x:x0-6,y:y+4.5,'text-anchor':'end','class':'ax'},g,fmt?fmt(t):String(t));});}
function title(g,t,sub){S('text',{x:16,y:27,'class':'ttl'},g,t);if(sub)S('text',{x:16,y:45,'class':'sub'},g,sub);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function Tip(svg){var g=S('g',{'class':'tip','pointer-events':'none',opacity:0},svg),r=S('rect',{rx:5,height:24},g),t=S('text',{},g);
 return {show:function(x,y,s){svg.appendChild(g);t.textContent=s;var w=(t.getComputedTextLength?t.getComputedTextLength():s.length*7.8)+16;var X=Math.max(4,Math.min(476-w,x-w/2)),Y=y-34<4?y+12:y-34;r.setAttribute('x',X);r.setAttribute('y',Y);r.setAttribute('width',w);t.setAttribute('x',X+8);t.setAttribute('y',Y+16.5);g.setAttribute('opacity',1);},hide:function(){g.setAttribute('opacity',0);}};}
(function () {
    var svg = document.getElementById('ch'), tip = Tip(svg);
    var C = [['Avel', 140, 138], ['Brinmoor', 330, 100], ['Castor Bay', 398, 200], ['Dunholm', 240, 232], ['Elsby', 92, 222]];
    var F = { 0: { 1: 120, 2: 60, 3: 30, 4: 90 }, 3: { 0: 40, 1: 25, 2: 80, 4: 15 } }, W = function (v) { return Math.max(2, v / 120 * 14); };
    title(svg, 'Avel ships most to Brinmoor', 'Shipments per week');
    S('path', { d: 'M40,118 C60,72 160,64 240,74 C320,62 430,72 448,128 C466,184 440,256 360,264 C280,274 180,272 110,266 C50,262 25,196 40,118 Z', fill: '#e4e8ef', stroke: '#c9ced8' }, svg);
    var fl = S('g', {}, svg), cg = S('g', {}, svg), dots = [];
    C.forEach(function (c) { dots.push(S('circle', { cx: c[1], cy: c[2], r: 5, fill: 'var(--fg)', stroke: '#fff', 'stroke-width': 2 }, cg)); S('text', { x: c[1], y: c[2] - 11, 'text-anchor': 'middle', 'class': 'lbl halo' }, cg, c[0]); });
    var lg = S('g', {}, svg); S('text', { x: 16, y: 292, 'class': 'ax' }, lg, 'Key:');
    [30, 60, 120].forEach(function (v, i) { var x0 = 60 + i * 80; S('line', { x1: x0, x2: x0 + 30, y1: 288, y2: 288, stroke: 'var(--accent)', 'stroke-width': W(v), 'stroke-opacity': .75 }, lg); S('text', { x: x0 + 36, y: 292, 'class': 'ax' }, lg, v); });
    var o = 0, api, btns = document.querySelectorAll('[data-o]'), ttl = svg.querySelector('.ttl');
    function draw() {
      fl.textContent = '';
      Object.keys(F[o]).forEach(function (k) {
        var a = C[o], b = C[k], v = F[o][k], mx = (a[1] + b[1]) / 2, my = (a[2] + b[2]) / 2, dx = b[1] - a[1], dy = b[2] - a[2];
        var cx = mx - dy * 0.2, cy = my + dx * 0.2;
        var p = S('path', { d: 'M' + a[1] + ',' + a[2] + 'Q' + cx + ',' + cy + ' ' + b[1] + ',' + b[2], fill: 'none', stroke: 'var(--accent)', 'stroke-opacity': .75, 'stroke-width': W(v), pathLength: 1, 'class': 'draw off', tabindex: 0, role: 'img', 'aria-label': a[0] + ' to ' + b[0] + ': ' + v + ' shipments a week' }, fl);
        var sh = function () { var s = a[0] + ' → ' + b[0] + ': ' + v + '/week'; tip.show((mx + cx) / 2, (my + cy) / 2 - 4, s); api && api.status(s); };
        p.addEventListener('focus', sh); p.addEventListener('mouseenter', sh); p.addEventListener('blur', tip.hide); p.addEventListener('mouseleave', tip.hide);
      });
      fl.getBoundingClientRect();
      fl.querySelectorAll('path').forEach(function (p) { p.classList.remove('off'); });
      dots.forEach(function (d, i) { d.setAttribute('r', i === o ? 8 : 5); d.setAttribute('fill', i === o ? 'var(--accent)' : 'var(--fg)'); });
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.o === o)); });
      ttl.textContent = o === 0 ? 'Avel ships most to Brinmoor' : 'Dunholm ships most to Castor Bay';
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { o = +b.dataset.o; tip.hide(); draw(); api.status('Showing flows from ' + C[o][0]); }); });
    api = AtlasDemo.init({ frames: 0, interactive: true, idleText: 'Switch the origin, or Tab to a line', reset: function () { o = 0; tip.hide(); draw(); } });
  })();
</script>
</body>
</html>
