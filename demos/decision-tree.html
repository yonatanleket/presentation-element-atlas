<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision tree: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.dg{position:absolute;inset:0;width:100%;height:100%;font-family:var(--f-body);overflow:visible}
.dg text{font-size:13px;fill:var(--fg)}
.dg .t-m{fill:var(--muted)} .dg .t-mono{font-family:var(--f-mono);font-size:13px}
.dg .t-b{font-weight:600} .dg .t-w{fill:#fff} .dg .t-a{fill:var(--accent)} .dg .t-bad{fill:var(--bad)} .dg .t-ok{fill:var(--ok)}
.dg .nd{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dg .nd-a{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dg .nd-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.2}
.dg .nd-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.dg .nd-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.2}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
.dg .ah{fill:var(--muted)} .dg .ah-a{fill:var(--accent)} .dg .ah-bad{fill:var(--bad)}
[data-f]{opacity:0;transition:opacity .35s var(--ease-out),transform .35s var(--ease-out),stroke-dashoffset .6s var(--ease-out)}
[data-f].on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1}.draw.on{stroke-dashoffset:0}
.cap{position:absolute;inset-inline:1.2em;inset-block-end:.6em;font-size:.8em;color:var(--ink-2);min-height:1.3em}
.hl{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linejoin:round}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Decision tree</h1>
<div class="stage" role="img" aria-label="Demo: Decision tree. A refund policy tree: within 30 days and unused gives a full refund, used gives store credit, after 30 days declines.">
<span class="label-illustrative">Illustrative</span>
<svg class="dg" viewBox="0 0 480 300" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-bad"/></marker>
</defs>
<g data-f="1"><rect x="170" y="22" width="140" height="36" rx="6" class="nd-a"/><text x="240" y="44.5" text-anchor="middle" class="t-b t-a">Within 30 days?</text></g>
<g data-f="2"><path d="M240 58 V84 H140 V108" class="ln " marker-end="url(#ah)"/><path d="M240 58 V84 H370 V108" class="ln " marker-end="url(#ah)"/><text x="186" y="78" text-anchor="middle" class="t-m t-mono">yes</text><text x="306" y="78" text-anchor="middle" class="t-m t-mono">no</text></g>
<g data-f="2"><rect x="80" y="112" width="120" height="36" rx="6" class="nd"/><text x="140" y="134.5" text-anchor="middle" class="t-b">Item unused?</text></g>
<g data-f="2"><rect x="290" y="112" width="160" height="36" rx="6" class="nd-bad"/><text x="370" y="134.5" text-anchor="middle" class="">Decline, offer repair</text></g>
<g data-f="3"><path d="M140 148 V176 H75 V202" class="ln " marker-end="url(#ah)"/><path d="M140 148 V176 H205 V202" class="ln " marker-end="url(#ah)"/><text x="100" y="170" text-anchor="middle" class="t-m t-mono">yes</text><text x="178" y="170" text-anchor="middle" class="t-m t-mono">no</text></g>
<g data-f="3"><rect x="20" y="206" width="110" height="36" rx="6" class="nd-ok"/><text x="75" y="228.5" text-anchor="middle" class="">Full refund</text></g>
<g data-f="3"><rect x="150" y="206" width="110" height="36" rx="6" class="nd-warn"/><text x="205" y="228.5" text-anchor="middle" class="">Store credit</text></g>
<g data-f="4"><path d="M240 58 V84 H140 V112 M140 148 V176 H75 V206" class="hl"/>
<text x="300" y="214" class="">Example: day 12,</text><text x="300" y="232" class="">box unopened</text><text x="300" y="252" class="t-b t-a">→ Full refund</text></g></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>Each box is a yes/no question and the coloured leaves are outcomes. Play reveals the tree one level at a time, then traces one example case from the root to its outcome so the audience sees how the policy is applied. The policy is illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function showFrames(f){$$('[data-f]').forEach(function(n){var k=+n.getAttribute('data-f');n.classList.toggle('on',f>=k);n.classList.toggle('cur',f===k);});}
function isRtl(){return (document.dir||document.documentElement.dir||'').toLowerCase()==='rtl';}
var CAPS=[];
AtlasDemo.init({frames:4,stepMs:1000,render:function(fr,ctx){showFrames(fr);var c=$('#cap');if(c)c.textContent=CAPS[fr]||'';}});
</script>
</body>
</html>
