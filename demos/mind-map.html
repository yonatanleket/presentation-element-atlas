<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.dg{position:absolute;inset:0;width:100%;height:100%;font-family:var(--f-body);overflow:visible}
.dg text{font-size:13px;fill:var(--fg)}
.dg .t-m{fill:var(--muted)} .dg .t-mono{font-family:var(--f-mono);font-size:13px}
.dg .t-b{font-weight:600} .dg .t-w{fill:#fff} .dg .t-a{fill:var(--accent)} .dg .t-bad{fill:var(--bad)} .dg .t-ok{fill:var(--ok)}
.dg .nd{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dg .nd-a{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dg .nd-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.2}
.dg .nd-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.dg .nd-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.2}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
.dg .ah{fill:var(--muted)} .dg .ah-a{fill:var(--accent)} .dg .ah-bad{fill:var(--bad)}
[data-f]{opacity:0;transition:opacity .35s var(--ease-out),transform .35s var(--ease-out),stroke-dashoffset .6s var(--ease-out)}
[data-f].on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1}.draw.on{stroke-dashoffset:0}
.cap{position:absolute;inset-inline:1.2em;inset-block-end:.6em;font-size:.8em;color:var(--ink-2);min-height:1.3em}
.br{fill:none;stroke:var(--accent);stroke-width:2}.lf{stroke:var(--muted);stroke-width:1}.lfd{fill:var(--muted)}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Mind map</h1>
<div class="stage" role="img" aria-label="Demo: Mind map. A mind map of offsite planning: venue, agenda, budget, activities and travel branch from the central topic.">
<span class="label-illustrative" style="inset-block-start:auto;inset-block-end:.4em;inset-inline-end:auto;inset-inline-start:.6em">Illustrative</span>
<svg class="dg" viewBox="0 0 480 300" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-bad"/></marker>
</defs>
<path d="M240 150 Q105 150 105 72" class="br draw" pathLength="1" data-f="2"/><path d="M240 150 Q375 150 375 72" class="br draw" pathLength="1" data-f="2"/><path d="M240 150 Q405 150 405 165" class="br draw" pathLength="1" data-f="2"/><path d="M240 150 Q285 150 285 250" class="br draw" pathLength="1" data-f="2"/><path d="M240 150 Q80 150 80 215" class="br draw" pathLength="1" data-f="2"/>
<g data-f="1"><ellipse cx="240" cy="150" rx="64" ry="26" class="nd-a"/><text x="240" y="155" text-anchor="middle" class="t-b t-a" style="font-size:15px">Q3 offsite</text></g>
<g data-f="2"><rect x="61" y="58" width="88" height="28" rx="14" class="nd"/><text x="105" y="76.5" text-anchor="middle" class="t-b">Venue</text></g><g data-f="2"><rect x="331" y="58" width="88" height="28" rx="14" class="nd"/><text x="375" y="76.5" text-anchor="middle" class="t-b">Agenda</text></g><g data-f="2"><rect x="361" y="151" width="88" height="28" rx="14" class="nd"/><text x="405" y="169.5" text-anchor="middle" class="t-b">Budget</text></g><g data-f="2"><rect x="241" y="236" width="88" height="28" rx="14" class="nd"/><text x="285" y="254.5" text-anchor="middle" class="t-b">Activities</text></g><g data-f="2"><rect x="36" y="201" width="88" height="28" rx="14" class="nd"/><text x="80" y="219.5" text-anchor="middle" class="t-b">Travel</text></g>
<g data-f="3"><line x1="105" y1="58" x2="105" y2="36" class="lf"/><text x="105" y="30" text-anchor="middle" class="t-m">Lisbon or Porto</text></g><g data-f="3"><line x1="375" y1="58" x2="375" y2="36" class="lf"/><text x="375" y="30" text-anchor="middle" class="t-m">Roadmap + retro</text></g><g data-f="3"><line x1="405" y1="179" x2="405" y2="192" class="lf"/><text x="405" y="208" text-anchor="middle" class="t-m">€40k cap</text></g><g data-f="3"><line x1="285" y1="264" x2="285" y2="274" class="lf"/><text x="285" y="290" text-anchor="middle" class="t-m">Cooking class</text></g><g data-f="3"><line x1="80" y1="229" x2="80" y2="242" class="lf"/><text x="80" y="258" text-anchor="middle" class="t-m">Book by 15 Jun</text></g></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>The central topic sits in the middle and each idea branches from it on its own curve, with one detail as a leaf. Play adds the centre, then the five branches, then the leaves, the order a brainstorm summary is usually read. Content is illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function showFrames(f){$$('[data-f]').forEach(function(n){var k=+n.getAttribute('data-f');n.classList.toggle('on',f>=k);n.classList.toggle('cur',f===k);});}
function isRtl(){return (document.dir||document.documentElement.dir||'').toLowerCase()==='rtl';}
var CAPS=[];
AtlasDemo.init({frames:3,stepMs:900,render:function(fr,ctx){showFrames(fr);var c=$('#cap');if(c)c.textContent=CAPS[fr]||'';}});
</script>
</body>
</html>
