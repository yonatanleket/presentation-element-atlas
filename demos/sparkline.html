<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
.rows{display:grid;gap:.8em;width:78%}
.r{display:grid;grid-template-columns:1fr auto 6em;align-items:center;gap:.8em}
.r b{font:700 1.4em/1 var(--f-display);font-variant-numeric:tabular-nums}
.ln{stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1s var(--ease-out)}.ln.on{stroke-dashoffset:0}
.dot{opacity:0;transition:opacity .2s .8s}.dot.on{opacity:1}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Sparkline</h1>
<div class="stage" role="img" aria-label="Demo: Sparkline">
<span class="label-illustrative">Illustrative</span>
<div class="fill center"><div class="rows" id="rows"></div></div>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>A word-sized line draws itself next to the current value and ends in a dot on the latest point. It carries no axes: it gives the shape of the trend, while the number gives the value. Data is illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
var R=[['Median release time','5.2 d',[9,8.8,9.1,8.2,7.4,6.9,6.1,5.2]],['Releases / week','37',[22,25,24,28,30,33,34,37]],['Rollback rate','3.1%',[3.4,3.0,3.6,3.2,2.9,3.3,3.0,3.1]]];
rows.innerHTML=R.map(function(r){var mn=Math.min.apply(0,r[2]),mx=Math.max.apply(0,r[2]),pts=r[2].map(function(v,i){return [i*(96/7)+2,26-(v-mn)/(mx-mn||1)*22];});
  var d='M'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' L');var l=pts[pts.length-1];
  return '<div class="r"><span class="muted">'+r[0]+'</span><b>'+r[1]+'</b><svg viewBox="0 0 100 30" role="img" aria-label="'+r[0]+' trend, latest '+r[1]+'"><path class="ln" d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" pathLength="200"/><circle class="dot" cx="'+l[0]+'" cy="'+l[1]+'" r="2.8" fill="var(--accent)"/></svg></div>';}).join('');
AtlasDemo.init({frames:1,stepMs:400,render:function(f){rows.querySelectorAll('.ln,.dot').forEach(function(n){n.classList.toggle('on',f>=1);});}});
</script>
</body>
</html>
