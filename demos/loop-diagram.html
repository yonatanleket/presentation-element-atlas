<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop diagram: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.dg{position:absolute;inset:0;width:100%;height:100%;font-family:var(--f-body);overflow:visible}
.dg text{font-size:13px;fill:var(--fg)}
.dg .t-m{fill:var(--muted)} .dg .t-mono{font-family:var(--f-mono);font-size:13px}
.dg .t-b{font-weight:600} .dg .t-w{fill:#fff} .dg .t-a{fill:var(--accent)} .dg .t-bad{fill:var(--bad)} .dg .t-ok{fill:var(--ok)}
.dg .nd{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dg .nd-a{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dg .nd-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.2}
.dg .nd-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.dg .nd-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.2}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
.dg .ah{fill:var(--muted)} .dg .ah-a{fill:var(--accent)} .dg .ah-bad{fill:var(--bad)}
[data-f]{opacity:0;transition:opacity .35s var(--ease-out),transform .35s var(--ease-out),stroke-dashoffset .6s var(--ease-out)}
[data-f].on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1}.draw.on{stroke-dashoffset:0}
.cap{position:absolute;inset-inline:1.2em;inset-block-end:.6em;font-size:.8em;color:var(--ink-2);min-height:1.3em}
.dg path.ln.bad{stroke:var(--bad);stroke-width:2.4;marker-end:url(#ahb)}.dg path.ln.good{stroke:var(--ok);stroke-width:2}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Loop diagram</h1>
<div class="stage" role="img" aria-label="Demo: Loop diagram. A review loop: of 1,000 monthly submissions 62 percent pass and 38 percent fail, get fixed and are resubmitted.">
<span class="label-illustrative">Illustrative</span>
<svg class="dg" viewBox="0 0 480 300" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-bad"/></marker>
</defs>
<text x="20" y="40" class="t-b" data-f="4" style="font-size:15px">The fail loop costs 760 review-days a month</text>
<g data-f="1"><rect x="22" y="110" width="96" height="40" rx="6" class="nd"/><text x="70" y="134.5" text-anchor="middle" class="t-b">Submit</text></g><text x="70" y="100" text-anchor="middle" class="t-m t-mono" data-f="1">1,000 / month</text>
<path d="M118 130 H186" class="ln " marker-end="url(#ah)" data-f="1"/>
<g data-f="1"><rect x="188" y="110" width="104" height="40" rx="6" class="nd-a"/><text x="240" y="134.5" text-anchor="middle" class="t-b t-a">Review</text></g>
<path d="M292 130 H356" class="ln good" marker-end="url(#ah)" data-f="2"/><text x="324" y="150" text-anchor="middle" class="t-ok t-b" data-f="2">62% pass</text>
<g data-f="2"><rect x="360" y="110" width="104" height="40" rx="6" class="nd-ok"/><text x="412" y="134.5" text-anchor="middle" class="">Approved</text></g>
<path d="M240 150 V211" class="ln bad" marker-end="url(#ah)" data-f="3"/><text x="250" y="186" class="t-bad t-b" data-f="3">38% fail</text>
<g data-f="3"><rect x="192" y="215" width="96" height="40" rx="6" class="nd-bad"/><text x="240" y="239.5" text-anchor="middle" class="t-b t-bad">Fix</text></g>
<path d="M192 235 H70 V154" class="ln bad" marker-end="url(#ah)" data-f="3"/><text x="132" y="227" text-anchor="middle" class="t-m t-mono" data-f="3">resubmit</text>
<g data-f="4"><rect x="292" y="252" width="176" height="26" rx="13" class="nd-bad"/><text x="380" y="270" text-anchor="middle" class="t-b t-bad">380 repeats × 2 days</text></g></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>Boxes are steps and the arrows leaving the review carry the share that takes each exit. Play draws the happy path first, then the fail exit and the loop back in red, and finishes with what the loop costs per month. Counts are illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function showFrames(f){$$('[data-f]').forEach(function(n){var k=+n.getAttribute('data-f');n.classList.toggle('on',f>=k);n.classList.toggle('cur',f===k);});}
function isRtl(){return (document.dir||document.documentElement.dir||'').toLowerCase()==='rtl';}
var CAPS=[];
AtlasDemo.init({frames:4,stepMs:950,render:function(fr,ctx){showFrames(fr);var c=$('#cap');if(c)c.textContent=CAPS[fr]||'';}});
</script>
</body>
</html>
