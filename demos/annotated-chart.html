<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotated chart: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.ch{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ch text{font-family:var(--f-body);font-size:13px;fill:var(--ink-2)}
.ch .ax{font:13px var(--f-mono);fill:var(--muted)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .base{stroke:var(--muted);stroke-width:1}
.ch .ttl{font:700 17px var(--f-display);fill:var(--fg)}
.ch .sub{font-size:13px;fill:var(--muted)}
.ch .lbl{font-weight:600;fill:var(--fg)}
.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s var(--ease-out),opacity .4s var(--ease-out)}
.grow.top{transform-origin:50% 0}
.growx{transform-box:fill-box;transform-origin:0 50%;transition:transform .6s var(--ease-out),opacity .4s var(--ease-out)}
.growx.end{transform-origin:100% 50%}
.off.grow{transform:scaleY(0)}.off.growx{transform:scaleX(0)}
.draw{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1s var(--ease-out)}.draw.off{stroke-dashoffset:1}
.fade{transition:opacity .45s var(--ease-out)}.fade.off{opacity:0}
@keyframes enter{from{opacity:0}to{opacity:1}}.enter{animation:enter .6s var(--ease-out) both}
.ch [tabindex]{outline:none;cursor:pointer}
.ch [tabindex]:focus-visible{stroke:var(--fg);stroke-width:2.5px}
.ch .tip rect{fill:var(--fg)}.ch .tip text{fill:#fff;font:500 13px var(--f-mono)}
.sctl{position:absolute;inset-block-start:2.2em;inset-inline-end:.6em;display:flex;gap:.3em;align-items:center;z-index:4}
.sctl label{font-size:.8em;color:var(--muted)}
.sctl input[type=range]{width:7em;accent-color:var(--accent)}
.sctl output{font:600 .85em var(--f-mono);min-width:2.8em}

</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Annotated chart</h1>
<div class="stage" role="img" aria-label="Demo: Annotated chart. Monthly signups line chart, January to December, rising from 12 to 28 thousand, with a callout at the July self-serve launch: plus 42 percent month over month.">
<span class="label-illustrative">Illustrative</span>
<svg class="ch" id="ch" viewBox="0 0 480 300" aria-hidden="true"></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>The line draws in, then a shaded band and a callout mark the July launch and state the jump in words (+42% month over month), so the audience reads the point instead of hunting for it. Data is illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
var NS='http://www.w3.org/2000/svg';
function S(t,a,p,x){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;if(p)p.appendChild(n);return n;}
function lin(d0,d1,r0,r1){return function(v){return r0+(v-d0)/(d1-d0)*(r1-r0);};}
function on(n,b){n.classList.toggle('off',!b);}
function yAxis(g,s,ticks,x0,x1,fmt){ticks.forEach(function(t){var y=s(t);S('line',{x1:x0,x2:x1,y1:y,y2:y,'class':'grid'},g);S('text',{x:x0-6,y:y+4.5,'text-anchor':'end','class':'ax'},g,fmt?fmt(t):String(t));});}
function title(g,t,sub){S('text',{x:16,y:27,'class':'ttl'},g,t);if(sub)S('text',{x:16,y:45,'class':'sub'},g,sub);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function Tip(svg){var g=S('g',{'class':'tip','pointer-events':'none',opacity:0},svg),r=S('rect',{rx:5,height:24},g),t=S('text',{},g);
 return {show:function(x,y,s){svg.appendChild(g);t.textContent=s;var w=(t.getComputedTextLength?t.getComputedTextLength():s.length*7.8)+16;var X=Math.max(4,Math.min(476-w,x-w/2)),Y=y-34<4?y+12:y-34;r.setAttribute('x',X);r.setAttribute('y',Y);r.setAttribute('width',w);t.setAttribute('x',X+8);t.setAttribute('y',Y+16.5);g.setAttribute('opacity',1);},hide:function(){g.setAttribute('opacity',0);}};}
(function () {
    var svg = document.getElementById('ch'), D = [12, 13, 13.5, 14, 15, 15.5, 22, 24, 25, 26, 27, 28], M = 'JFMAMJJASOND'.split('');
    title(svg, 'Signups jumped after self-serve launch', 'Monthly signups, thousands, 2026');
    var x = lin(0, 11, 62, 456), y = lin(0, 30, 262, 72);
    var band = S('rect', { x: x(5.5), y: 72, width: x(11) - x(5.5) + 8, height: 190, fill: 'var(--accent-soft)', 'class': 'fade off' }, svg);
    yAxis(svg, y, [0, 10, 20, 30], 52, 464);
    M.forEach(function (m, i) { S('text', { x: x(i), y: 282, 'text-anchor': 'middle', 'class': 'ax' }, svg, m); });
    var line = S('path', { d: D.map(function (v, i) { return (i ? 'L' : 'M') + x(i) + ',' + y(v); }).join(''), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 3, 'stroke-linejoin': 'round', pathLength: 1, 'class': 'draw off' }, svg);
    var dots = D.map(function (v, i) { var c = S('circle', { cx: x(i), cy: y(v), r: 3.5, fill: 'var(--accent)', 'class': 'fade off' }, svg); c.style.transitionDelay = (i * 70) + 'ms'; return c; });
    var ann = S('g', { 'class': 'fade off' }, svg);
    S('line', { x1: x(6) - 14, y1: 108, x2: x(6) - 3, y2: y(22) - 5, stroke: 'var(--fg)', 'stroke-width': 1.5 }, ann);
    S('text', { x: x(6) - 16, y: 94, 'text-anchor': 'end', 'class': 'lbl' }, ann, 'Self-serve launch, July');
    S('text', { x: x(6) - 16, y: 111, 'text-anchor': 'end' }, ann, '+42% month over month');
    AtlasDemo.init({ frames: 2, stepMs: 1300, render: function (f) {
      on(line, f >= 1); dots.forEach(function (d) { on(d, f >= 1); }); on(band, f >= 2); on(ann, f >= 2);
    } });
  })();
</script>
</body>
</html>
