<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle / flywheel: demo</title>
<link rel="stylesheet" href="_harness.css">
<style>
svg.dg{position:absolute;inset:0;width:100%;height:100%;font-family:var(--f-body);overflow:visible}
.dg text{font-size:13px;fill:var(--fg)}
.dg .t-m{fill:var(--muted)} .dg .t-mono{font-family:var(--f-mono);font-size:13px}
.dg .t-b{font-weight:600} .dg .t-w{fill:#fff} .dg .t-a{fill:var(--accent)} .dg .t-bad{fill:var(--bad)} .dg .t-ok{fill:var(--ok)}
.dg .nd{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dg .nd-a{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dg .nd-ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.2}
.dg .nd-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2}
.dg .nd-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.2}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.6}
.dg .ah{fill:var(--muted)} .dg .ah-a{fill:var(--accent)} .dg .ah-bad{fill:var(--bad)}
[data-f]{opacity:0;transition:opacity .35s var(--ease-out),transform .35s var(--ease-out),stroke-dashoffset .6s var(--ease-out)}
[data-f].on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1}.draw.on{stroke-dashoffset:0}
.cap{position:absolute;inset-inline:1.2em;inset-block-end:.6em;font-size:.8em;color:var(--ink-2);min-height:1.3em}
.dg path.ln{stroke-width:2.2;stroke:var(--accent)}.dg .ah{fill:var(--accent)}
</style>
</head>
<body>
<main class="demo" data-state="loading">
<h1 class="demo-title">Cycle / flywheel</h1>
<div class="stage" role="img" aria-label="Demo: Cycle / flywheel. A four-stage growth flywheel: more users, more templates, faster setup, more referrals, back to more users.">
<span class="label-illustrative">Illustrative</span>
<svg class="dg" viewBox="0 0 480 300" aria-hidden="true"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-bad"/></marker>
</defs>
<text x="240" y="152" text-anchor="middle" class="t-m">Growth</text><text x="240" y="168" text-anchor="middle" class="t-m">flywheel</text>
<g data-f="1"><rect x="187" y="40" width="106" height="36" rx="6" class="nd-a"/><text x="240" y="62.5" text-anchor="middle" class="t-b t-a">More users</text></g><path d="M303.4 67.4 A150 100 0 0 1 381 123.8" class="ln draw" pathLength="1" marker-end="url(#ah)" data-f="1"/>
<g data-f="2"><rect x="337" y="140" width="106" height="36" rx="6" class="nd"/><text x="390" y="162.5" text-anchor="middle" class="">More templates</text></g><path d="M381 192.2 A150 100 0 0 1 303.4 248.6" class="ln draw" pathLength="1" marker-end="url(#ah)" data-f="2"/>
<g data-f="3"><rect x="187" y="240" width="106" height="36" rx="6" class="nd"/><text x="240" y="262.5" text-anchor="middle" class="">Faster setup</text></g><path d="M176.6 248.6 A150 100 0 0 1 99 192.2" class="ln draw" pathLength="1" marker-end="url(#ah)" data-f="3"/>
<g data-f="4"><rect x="37" y="140" width="106" height="36" rx="6" class="nd"/><text x="90" y="162.5" text-anchor="middle" class="">More referrals</text></g><path d="M99 123.8 A150 100 0 0 1 176.6 67.4" class="ln draw" pathLength="1" marker-end="url(#ah)" data-f="4"/>
<text x="240" y="200" text-anchor="middle" class="t-b t-a" data-f="5">Each turn compounds</text></svg>
</div>
<div class="controls"></div>
<details class="how" open><summary>How it works</summary><p>Four stages sit on a loop and each arrow says the stage feeds the next one. Play adds a stage and its arrow at a time until the loop closes back on More users, then names the compounding effect in the middle. Stages are illustrative.</p></details>
</main>
<script src="_harness.js"></script>
<script>
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function showFrames(f){$$('[data-f]').forEach(function(n){var k=+n.getAttribute('data-f');n.classList.toggle('on',f>=k);n.classList.toggle('cur',f===k);});}
function isRtl(){return (document.dir||document.documentElement.dir||'').toLowerCase()==='rtl';}
var CAPS=[];
AtlasDemo.init({frames:5,stepMs:850,render:function(fr,ctx){showFrames(fr);var c=$('#cap');if(c)c.textContent=CAPS[fr]||'';}});
</script>
</body>
</html>
